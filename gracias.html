<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias | Gabriel Garcia Lorenzo</title>
  <meta name="description" content="Mensaje enviado correctamente.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #f3f7ff;
      --bg-2: #e6f0ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0f62fe;
      --accent-2: #22c55e;
      --shadow: 0 18px 45px rgba(15, 98, 254, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #cfe3ff 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #d9f6e5 0%, transparent 60%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 1.2rem;
    }

    .card {
      width: min(680px, 100%);
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(15, 98, 254, 0.12);
      animation: rise 0.6s ease;
    }

    .band {
      height: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .content {
      padding: 2.3rem 2rem 2rem;
      text-align: center;
    }

    .badge {
      width: 84px;
      height: 84px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8fff0, #f2fff7);
      border: 2px solid #b7ebcf;
      display: grid;
      place-items: center;
      color: #15803d;
      font-size: 2rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.8vw, 2.25rem);
      line-height: 1.15;
    }

    p {
      margin: 0.9rem auto 0;
      max-width: 48ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .actions {
      margin-top: 1.7rem;
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      padding: 0.72rem 1.1rem;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 10px 20px rgba(15, 98, 254, 0.28);
    }

    .btn-secondary {
      color: var(--accent);
      background: #eef4ff;
      border: 1px solid #d4e4ff;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Confirmacion de envio">
    <div class="band"></div>
    <div class="content">
      <div class="badge" aria-hidden="true">✓</div>
      <h1>Mensaje enviado correctamente</h1>
      <p>Gracias por contactar conmigo. He recibido tu mensaje y te respondere lo antes posible.</p>
      <div class="actions">
        <a class="btn btn-primary" href="index.html#contacto">Volver al portfolio</a>
        <a class="btn btn-secondary" href="index.html#proyectos">Ver proyectos</a>
      </div>
    </div>
  </main>
</body>
</html>
